# Retained for consistency with the wider codebase. The ledger core is a pure
# function of the event stream -- no repository, no transport, no clock -- so it
# has no collaborators to mock and the test suite does not use this.
template: testify
dir: "{{.InterfaceDir}}"
structname: "Mock{{.InterfaceName}}"
pkgname: "{{.SrcPackageName}}_mock"
filename: "mock/{{.InterfaceName | snakecase | lower}}_mock.go"
inpackage: false
all: false

packages:
  github.com/ericmarcelinotju/mal-assessment/app/module:
    config:
      recursive: true
      all: true
